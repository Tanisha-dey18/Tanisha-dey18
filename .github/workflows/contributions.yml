name: Contribution art

on:
  schedule:
    - cron: "0 18 * * *" # daily, 23:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-art
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D isometric city of the contribution calendar -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Snake that eats the contribution grid -> dist/*.svg
      - uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#7c3aed
            dist/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#3b2a6b,#5b3fa8,#8b5cf6,#c4b5fd

      - name: Commit generated art
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib dist
          if git commit -m "Update contribution art"; then
            git push
          fi
