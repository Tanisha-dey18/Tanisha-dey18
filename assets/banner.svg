<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="r"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .o1{animation:f1 14s ease-in-out infinite} .o2{animation:f2 18s ease-in-out infinite}
    @keyframes f1{50%{transform:translate(60px,30px)}} @keyframes f2{50%{transform:translate(-70px,-20px)}}
    .cur{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
    .fade{opacity:0;animation:in .9s ease-out forwards} .d2{animation-delay:.25s} .d3{animation-delay:.5s}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  </style>
  <g clip-path="url(#r)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <circle class="o1" cx="720" cy="60" r="110" fill="#7c3aed" opacity=".35" filter="url(#blur)"/>
    <circle class="o2" cx="820" cy="230" r="90" fill="#0ea5e9" opacity=".3" filter="url(#blur)"/>
    <g font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#64748b" class="fade">
      <text x="56" y="62">~/tanisha-dey18 <tspan fill="#a78bfa">$</tspan> whoami<tspan class="cur" fill="#7dd3fc"> ▍</tspan></text>
    </g>
    <text x="54" y="128" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="url(#ink)" class="fade d2">Tanisha Dey</text>
    <text x="56" y="168" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="20" fill="#cbd5e1" class="fade d2">AI / ML engineer · B.Tech CSE (Data Science)</text>
    <g class="fade d3" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12.5">
      <g transform="translate(56,196)"><rect width="170" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="85.0" y="18.5" text-anchor="middle" fill="#e2e8f0">anomaly detection</text></g><g transform="translate(236,196)"><rect width="92" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="46.0" y="18.5" text-anchor="middle" fill="#e2e8f0">RAG + LLMs</text></g><g transform="translate(338,196)"><rect width="150" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="75.0" y="18.5" text-anchor="middle" fill="#e2e8f0">ML forensics</text></g><g transform="translate(498,196)"><rect width="150" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="75.0" y="18.5" text-anchor="middle" fill="#e2e8f0">full-stack apps</text></g>
    </g>
  </g>
</svg>